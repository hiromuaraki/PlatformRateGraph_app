<ul class="pagination justify-content-left">

    {% if works.has_previous %}
        <li class="page-item">
            <a href="/rate_graph/platform_info/?platform={{ select }}&page=1" 
               class="page-link">&laquo; 最初へ</a>
        </li>
        <li class="page-item">
            <a href="/rate_graph/platform_info/?platform={{ select }}&page={{ works.previous_page_number }}" 
               class="page-link">&laquo; 前へ</a>
        </li>
    {% else %}
        <li class="page-item disabled"><a class="page-link">&laquo; 最初へ</a></li>
        <li class="page-item disabled"><a class="page-link">&laquo; 前へ</a></li>
    {% endif %}

    <li class="page-item disabled">
        <a class="page-link">{{ works.number }} / {{ works.paginator.num_pages }}</a>
    </li>

    {% if works.has_next %}
        <li class="page-item">
            <a href="/rate_graph/platform_info/?platform={{ select }}&page={{ works.next_page_number }}" 
               class="page-link">次へ &raquo;</a>
        </li>
        <li class="page-item">
            <a href="/rate_graph/platform_info/?platform={{ select }}&page={{ works.paginator.num_pages }}" 
               class="page-link">最後へ &raquo;</a>
        </li>
    {% else %}
        <li class="page-item disabled"><a class="page-link">次へ &raquo;</a></li>
        <li class="page-item disabled"><a class="page-link">最後へ &raquo;</a></li>
    {% endif %}

</ul>
