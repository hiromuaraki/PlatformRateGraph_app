{% load static %}
<!DOCTYPE>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>{{title}}</title>
        <!--Bootstrap CSS-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
        
        <!-- ① Chart.js 本体（CDN） -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <!-- ラベルと割合をグラフに表示 -->
        <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
        <style>
            h1.select-color {
                border-radius: 30px;
                width: 600px;
                padding: 20px;
                margin-bottom: 40px;
            }

            h1 a {
                color: #FFF;
            }

            h1.title {
                background-color: #000;
                width: 600px;
                height: 100px;
                color: #FFF;
                padding: 20px;
                border-radius: 20px;
            }

            
            a {
                text-decoration: none;
            }

            #detail-area {
                transition: opacity 0.25s ease-in-out;
                opacity: 1;
            }
            
            #detail-area.fade-out {
                opacity: 0;
            }


            table.fixed {
                width: 1000px;
                table.fixed: fixed;
            }

            table td.title {
                width: 600px;

            }

            table td.left {
                text-align: left;
            }

            table td.max-wid {
                width: 150px;
            }

            table th.font {
                height: 40px;
                font-size: 25px;
            }

        </style>
    </head>

    <body class="container d-flex flex-column align-items-center mt-4">
        <h1 class="text-center mb-5 title">{{ title }}</h1>
        <div class="mb-5" style="width: 1100px;">
            <canvas id="pieChart" width="1100"></canvas>
        </div>
        <!--クリックイベント-->
        <div id="detail-area" style="display:none;"></div>

        <!--PythonのデータをJSへ渡す-->
        {{ labels|json_script:"labels-data" }}
        {{ data|json_script:"chart-data" }}
        {{ color|json_script:"chart-color" }}
        {{ p_count|json_script:"chart-p_count" }}

        <!-- ② pie_chart.js（静的ファイル） -->
        <script src="{% static "js/pie_chart.js" %}?v={{version}}"></script>
    </body>

</html>
