services:
  - type: web
    name: PlatformRateGraph_app
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: |
      python manage.py migrate --noinput
      python manage.py loaddata data/*.json || true
      gunicorn PlatformRateGraph_app.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
