{% load static %}
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>{{title}}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <script src="{% static 'js/form_control.js' %}"></script>
</head>


<body>
    <div class="container">
        <h1>{{title}}</h1>
        {% if messages %}
        <div class="alert alert-primary alert-dismissible fade show" role="alert">
            {% for message in messages %}
            <p>{{message}}</p>
            {% endfor %}
        </div>
        {% endif %}
        <form action="{% url "form" %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- シーズン件数 -->
            {{ form.season_delivery_cnt }}

            <!-- CSVファイル -->
            <label for="csv-file" class="file-label">CSVファイル選択</label>
            {{ form.csv_file }}
            <div id="file-name"></div>
            
            <!-- 送信ボタン -->
            {% if is_take %}
            <p><a class="rate" href="{% url "chart" %}">🚀割合グラフ画面へLet’s Go!!</a></p>
            {% else %}
            <button id="submit-btn" type="submit" disabled>取込</button>
            {% endif %}
        </form>
    </div>

</body>

</html>
