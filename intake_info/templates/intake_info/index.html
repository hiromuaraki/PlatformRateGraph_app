{% load static %}
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>{{title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <script src="{% static 'js/form_control.js' %}"></script>

    <script>
    // ------------------------------
    // 通知関数
    // ------------------------------
    function showNotification(msg) {
        const container = document.getElementById("notification-container");
        
        const div = document.createElement("div");
        div.classList.add("notification");
        div.textContent = msg;
        
        container.appendChild(div);
        
        // 出現アニメーション
        setTimeout(() => div.classList.add("show"), 10);
        
        // 2秒後にフェードアウト
        setTimeout(() => {
            div.classList.remove("show");
        
            // ★ 完全にアニメーションが終わってから DOM 削除 ★
            setTimeout(() => {
                div.remove();
            }, 400);  // transition と同じ値
        }, 2000);
    }
    </script>
</head>

<body>
    <div class="container">
        <h1>{{title}}</h1>
        <div class="message-wrapper">
            <div id="notification-container" class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert"></div> 
            <script>
            {% if messages %}
                {% for message in messages %}
                    showNotification("{{ message | escapejs }}");
                {% endfor %}
            {% endif %}
            </script>
        </div>

        <form action="{% url "form" %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- シーズン件数 -->
            {{ form.season_delivery_cnt }}

            <!-- CSVファイル -->
            <label for="csv-file" class="file-label">CSVファイル選択</label>
            {{ form.csv_file }}
            <div id="file-name"></div>
            
            <!-- 送信ボタン -->
            {% if is_take %}
            <p><a class="rate" href="{% url "chart" %}">🚀割合グラフ画面へLet’s Go!!</a></p>
            {% else %}
            <button id="submit-btn" type="submit" disabled>取込</button>
            {% endif %}
        </form>
    </div>

    <script>
    // ------------------------------
    // 通知の表示制御関数
    // ------------------------------
    setTimeout(() => {
        document.querySelectorAll(".alert").forEach(el => {
            el.classList.remove("show");
        });
    }, 2000);

    </script>
</body>

</html>
